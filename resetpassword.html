<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{--chalk-green:#1F3D2B;--chalk-green-light:#2C5540;--dust:#F2EFE6;--paper:#FFFFFF;--pen-red:#C1392B;--pen-red-dark:#a12e22;--rule-blue:#4A6FA5;--ink:#2B2B24;--ink-soft:#6b6a5f;--border:#E1DCC9;--good:#2E7D4F;}
  *{box-sizing:border-box;}
  body{margin:0;font-family:'IBM Plex Sans',Segoe UI,Arial,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--chalk-green);
    background-image:linear-gradient(var(--chalk-green-light) 1px, transparent 1px),linear-gradient(90deg, var(--chalk-green-light) 1px, transparent 1px);background-size:28px 28px;padding:20px;}
  .card{background:var(--dust);border-radius:6px;padding:36px 32px;width:100%;max-width:380px;box-shadow:0 20px 50px rgba(0,0,0,0.35);border-top:6px solid var(--pen-red);}
  h1{font-family:'Zilla Slab',Georgia,serif;margin:0 0 4px;font-size:24px;color:var(--chalk-green);}
  p.sub{margin:0 0 24px;color:var(--ink-soft);font-size:14px;}
  label{display:block;font-size:13px;margin:14px 0 6px;color:var(--ink-soft);font-weight:600;}
  input{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:4px;font-size:15px;background:var(--paper);color:var(--ink);}
  button{margin-top:22px;width:100%;padding:12px;background:var(--pen-red);color:#fff;border:none;border-radius:4px;font-size:15px;font-weight:600;cursor:pointer;}
  button:hover{background:var(--pen-red-dark);}
  button:disabled{opacity:0.6;}
  .msg{font-size:13px;margin-top:12px;min-height:16px;}
  .msg.err{color:var(--pen-red);}
  .msg.ok{color:var(--good);}
</style>
</head>
<body>
<div class="card">
  <h1>🔑 Reset Password</h1>
  <p class="sub">Set a new password for your account</p>
  <label>New password</label>
  <input id="pw1" type="password" placeholder="At least 6 characters">
  <label>Confirm new password</label>
  <input id="pw2" type="password" placeholder="Type it again">
  <button id="btn" onclick="doReset()">Set new password</button>
  <div class="msg" id="msg"></div>
</div>
<script>
const SUPABASE_URL = "https://efqstsysxpdkkxiarumf.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVmcXN0c3lzeHBka2t4aWFydW1mIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc4MjMyNzcsImV4cCI6MjEwMzM5OTI3N30.J0DrMc3zdbBXkOyoTw3je-GSPnW-ClEYZM16l27Y47k";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

async function doReset(){
  const pw1 = document.getElementById('pw1').value;
  const pw2 = document.getElementById('pw2').value;
  const msg = document.getElementById('msg');
  msg.className = 'msg err';
  if(pw1.length < 6){ msg.textContent = 'Password must be at least 6 characters.'; return; }
  if(pw1 !== pw2){ msg.textContent = 'Passwords do not match.'; return; }

  document.getElementById('btn').disabled = true;
  const { error } = await sb.auth.updateUser({ password: pw1 });
  if(error){ msg.textContent = error.message; document.getElementById('btn').disabled = false; return; }
  msg.className = 'msg ok';
  msg.textContent = 'Password updated! You can close this tab and sign in with your new password.';
  document.getElementById('btn').style.display = 'none';
  document.getElementById('pw1').disabled = true;
  document.getElementById('pw2').disabled = true;
}
</script>
</body>
</html>
