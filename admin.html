<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>School Admin — Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --chalk-green:#1F3D2B;
    --chalk-green-light:#2C5540;
    --dust:#F2EFE6;
    --paper:#FFFFFF;
    --pen-red:#C1392B;
    --pen-red-dark:#a12e22;
    --rule-blue:#4A6FA5;
    --ink:#2B2B24;
    --ink-soft:#6b6a5f;
    --border:#E1DCC9;
    --good:#2E7D4F;
    --warn:#C1392B;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'IBM Plex Sans',Segoe UI,Arial,sans-serif;
    background:var(--dust);
    color:var(--ink);
    overflow-x:hidden;
    -webkit-text-size-adjust:100%;
  }
  @font-face{}
  h1,h2,h3,.brand{
    font-family:'Zilla Slab',Georgia,serif;
  }
  .num{font-family:'IBM Plex Mono',monospace;}

  /* ---------- Login ---------- */
  #loginScreen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--chalk-green);
    background-image:
      linear-gradient(var(--chalk-green-light) 1px, transparent 1px),
      linear-gradient(90deg, var(--chalk-green-light) 1px, transparent 1px);
    background-size:28px 28px;
    padding:20px;
  }
  .login-card{
    background:var(--dust);
    border-radius:6px;
    padding:36px 32px;
    width:100%;
    max-width:380px;
    box-shadow:0 20px 50px rgba(0,0,0,0.35);
    border-top:6px solid var(--pen-red);
  }
  .login-card h1{
    margin:0 0 4px;
    font-size:28px;
    color:var(--chalk-green);
  }
  .login-card p.sub{
    margin:0 0 24px;
    color:var(--ink-soft);
    font-size:14px;
  }
  .tabs-auth{display:flex;gap:8px;margin-bottom:20px;}
  .tabs-auth button{
    flex:1;padding:8px;border-radius:4px;border:1px solid var(--border);
    background:var(--paper);cursor:pointer;font-size:13px;color:var(--ink-soft);
  }
  .tabs-auth button.active{background:var(--chalk-green);color:#fff;border-color:var(--chalk-green);}
  label{display:block;font-size:13px;margin:14px 0 6px;color:var(--ink-soft);font-weight:600;}
  input,select,textarea{
    width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:4px;
    font-size:16px;background:var(--paper);color:var(--ink);font-family:inherit;
  }
  input:focus,select:focus,textarea:focus{outline:2px solid var(--rule-blue);outline-offset:1px;}
  button.primary{
    margin-top:22px;width:100%;padding:12px;background:var(--pen-red);color:#fff;
    border:none;border-radius:4px;font-size:15px;font-weight:600;cursor:pointer;
  }
  button.primary:hover{background:var(--pen-red-dark);}
  button.primary:disabled{opacity:0.6;cursor:default;}
  .login-error{color:var(--pen-red);font-size:13px;margin-top:12px;min-height:16px;}
  .login-note{font-size:12px;color:var(--ink-soft);margin-top:16px;line-height:1.5;}

  /* ---------- App shell ---------- */
  #app{display:none;min-height:100vh;}
  .shell{display:flex;min-height:100vh;}
  .sidebar{
    width:220px;flex-shrink:0;background:var(--chalk-green);color:#fff;
    padding:22px 14px;position:sticky;top:0;height:100vh;overflow-y:auto;
  }
  .sidebar .brand{font-size:19px;margin:0 8px 4px;color:#fff;}
  .sidebar .brand-sub{font-size:11px;margin:0 8px 22px;color:#c9dccd;letter-spacing:.04em;text-transform:uppercase;}
  .navbtn{
    display:block;width:100%;text-align:left;padding:11px 12px;border-radius:5px;border:none;
    background:transparent;color:#e7efe8;font-size:14.5px;cursor:pointer;margin-bottom:2px;
  }
  .navbtn:hover{background:var(--chalk-green-light);}
  .navbtn.active{background:var(--pen-red);color:#fff;font-weight:600;}
  .sidebar .signout{margin-top:20px;font-size:12.5px;color:#c9dccd;background:none;border:1px solid #47654f;padding:8px;border-radius:4px;width:100%;cursor:pointer;}
  .sidebar .signout:hover{background:var(--chalk-green-light);}

  .main{flex:1;padding:26px 30px;max-width:1100px;}
  .topline{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:22px;flex-wrap:wrap;gap:10px;}
  .topline h2{margin:0 0 4px;font-size:24px;color:var(--chalk-green);}
  .topline p{margin:0;color:var(--ink-soft);font-size:13.5px;}
  .btn{padding:9px 16px;border-radius:5px;border:none;font-size:14px;cursor:pointer;font-weight:600;}
  .btn-add{background:var(--pen-red);color:#fff;}
  .btn-add:hover{background:var(--pen-red-dark);}
  .btn-ghost{background:transparent;border:1px solid var(--border);color:var(--ink);}
  .btn-ghost:hover{background:#fff;}
  .btn-small{padding:7px 12px;font-size:12.5px;border-radius:4px;border:1px solid var(--border);background:#fff;cursor:pointer;margin-right:6px;min-height:32px;}
  .btn-small.danger{color:var(--pen-red);border-color:#e8c3bd;}
  .btn-small.danger:hover{background:#fdecea;}

  .card{background:var(--paper);border:1px solid var(--border);border-radius:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;overflow-y:hidden;}
  table{width:100%;border-collapse:collapse;font-size:14px;}
  thead th{
    text-align:left;padding:11px 14px;background:#f8f6ee;color:var(--ink-soft);
    font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;border-bottom:2px solid var(--border);
    white-space:nowrap;
  }
  tbody td{padding:11px 14px;border-bottom:1px solid var(--border);white-space:nowrap;}
  tbody td.wrap-cell{white-space:normal;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:#fbfaf5;}
  .pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:600;}
  .pill.active{background:#e4f3e9;color:var(--good);}
  .pill.left{background:#f3e4e4;color:var(--pen-red);}
  .pill.promoted{background:#e5eaf3;color:var(--rule-blue);}
  .empty{padding:36px 20px;text-align:center;color:var(--ink-soft);font-size:14px;}
  .loading{padding:36px 20px;text-align:center;color:var(--ink-soft);font-size:14px;}

  .filters{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
  .filters select{width:auto;min-width:150px;}

  /* Modal */
  .modal-bg{
    display:none;position:fixed;inset:0;background:rgba(31,61,43,0.55);
    align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;z-index:50;
  }
  .modal-bg.show{display:flex;}
  .modal{background:var(--paper);border-radius:8px;width:100%;max-width:460px;padding:26px 26px 24px;box-shadow:0 20px 50px rgba(0,0,0,0.3);}
  .modal h3{margin:0 0 18px;color:var(--chalk-green);font-size:19px;}
  .modal-actions{display:flex;gap:10px;margin-top:22px;}
  .modal-actions .btn{flex:1;}
  .modal .field-error{color:var(--pen-red);font-size:12.5px;margin-top:10px;}
  .checkbox-row{display:flex;align-items:center;gap:8px;margin-top:16px;}
  .checkbox-row input{width:auto;}
  .checkbox-row label{margin:0;font-weight:500;}

  .subtable{margin-top:10px;border-top:1px solid var(--border);padding-top:10px;}
  .subtable .row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:13.5px;}

  .grade-D1,.grade-D2{color:var(--good);font-weight:700;}
  .grade-C3,.grade-C4,.grade-C5{color:var(--rule-blue);font-weight:700;}
  .grade-C6,.grade-P7,.grade-P8{color:#b8860b;font-weight:700;}
  .grade-F9{color:var(--pen-red);font-weight:700;}
  .student-photo{width:34px;height:34px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:8px;border:1px solid var(--border);}
  .student-photo-lg{width:64px;height:64px;border-radius:50%;object-fit:cover;border:2px solid var(--border);float:right;}
  .photo-preview{width:70px;height:70px;border-radius:50%;object-fit:cover;border:1px solid var(--border);margin-top:8px;display:block;}
  .subject-checks{display:flex;flex-direction:column;gap:6px;max-height:160px;overflow-y:auto;border:1px solid var(--border);border-radius:4px;padding:8px;margin-top:4px;}
  .subject-checks label{display:flex;align-items:center;gap:8px;font-weight:500;margin:0;color:var(--ink);font-size:14px;}
  .subject-checks input{width:auto;}
  @media print{
    .report-card-print{page-break-after:always; page-break-inside:avoid;}
    @page{ size:A4; margin:10mm; }
  }

  .report-card{background:#fff;border:2px solid var(--chalk-green);padding:14px 18px;max-width:720px;margin:16px auto;font-size:12.5px;}
  .report-card table{border-collapse:collapse;font-size:11px;width:100%;}
  .report-card th, .report-card td{padding:3px 6px;border:1px solid var(--ink);white-space:normal;background:none;text-transform:none;letter-spacing:normal;font-size:11px;color:var(--ink);}
  .report-card thead th{background:#f0efe6;font-weight:700;}
  .report-card tfoot td{background:#f7f6ee;}
  .report-card h3{color:var(--chalk-green);margin:0 0 2px;}
  .report-card .meta{font-size:13px;color:var(--ink-soft);margin-bottom:14px;}
  .report-card table{margin-top:0;}
  .report-card .comments{margin-top:10px;font-size:12px;line-height:1.5;}
  .report-card .comments b{color:var(--chalk-green);}
  .rc-box{border:1px solid var(--ink);margin-top:8px;}
  .rc-box-title{background:#f0efe6;font-weight:700;text-align:center;font-size:11.5px;padding:4px 0;border-bottom:1px solid var(--ink);letter-spacing:.03em;}
  .rc-box table{width:100%;}
  .rc-box table th, .rc-box table td{border:1px solid var(--ink) !important;padding:4px 6px;font-size:11px;}
  .rc-field-row{display:flex;flex-wrap:wrap;border:1px solid var(--ink);}
  .rc-field{flex:1 1 33%;border-right:1px solid var(--ink);padding:5px 8px;font-size:11.5px;min-width:0;}
  .rc-field:last-child{border-right:none;}
  .rc-field b{display:block;font-size:9.5px;text-transform:uppercase;color:var(--ink-soft);letter-spacing:.03em;margin-bottom:1px;}
  .rc-signoff{border:1px solid var(--ink);padding:6px 10px;margin-top:8px;font-size:11.5px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;}

  @media(max-width:820px){
    .shell{flex-direction:column;}
    .sidebar{width:100%;height:auto;position:relative;display:flex;flex-wrap:wrap;gap:4px;padding:14px;}
    .sidebar .brand,.sidebar .brand-sub{width:100%;}
    .navbtn{width:auto;flex:1 1 auto;text-align:center;font-size:13px;padding:10px 8px;min-height:40px;}
    .sidebar .signout{width:auto;margin-left:auto;}
    .main{padding:14px;}
    .topline{gap:12px;}
    .topline h2{font-size:20px;}
    .modal{padding:22px 18px 20px;}
    .login-card{padding:28px 20px;}
  }
  @media(max-width:420px){
    .filters select,.filters input{min-width:0;flex:1 1 100%;}
  }
  @media print{
    .sidebar,.topline,.filters,#printBtnWrap,.card{display:none !important;}
    body *{visibility:hidden;}
    #printableReport,#printableReport *{visibility:visible;}
    #printableReport{position:absolute;top:0;left:0;width:100%;}
    .main{padding:0;max-width:none;}
    body{background:#fff;}
  }
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="loginScreen">
  <div class="login-card">
    <h1>🏫 <span id="brandName">School Admin</span></h1>
    <p class="sub" id="brandMotto">Baby Class – P7 · Marks & Reports</p>

    <div class="tabs-auth">
      <button id="tabSignin" class="active" onclick="setAuthMode('signin')">Sign in</button>
      <button id="tabSignup" onclick="setAuthMode('signup')">Teacher sign up</button>
    </div>

    <div id="signupNameWrap" style="display:none;">
      <label>Full name</label>
      <input id="signupName" placeholder="e.g. Nakato Grace">
    </div>
    <label>Email</label>
    <input id="authEmail" type="email" placeholder="you@example.com">
    <label>Password</label>
    <input id="authPass" type="password" placeholder="••••••••">

    <button class="primary" id="authSubmitBtn" onclick="handleAuthSubmit()">Sign in</button>
    <div class="login-error" id="authError"></div>
    <div style="text-align:center;margin-top:10px;"><a href="#" onclick="handleForgotPassword();return false;" style="font-size:12.5px;color:var(--rule-blue);">Forgot password?</a></div>
    <div class="login-note" id="authNote">Admins: sign in with the account created in Supabase. Teachers: use "Teacher sign up" to create your own login — the admin will then assign your class and subject.</div>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app">
  <div class="shell">
    <div class="sidebar">
      <div class="brand">🏫 School Admin</div>
      <div class="brand-sub">Baby Class – P7</div>
      <button class="navbtn" data-tab="dashboard" onclick="showTab('dashboard')">Dashboard</button>
      <button class="navbtn" data-tab="classes" onclick="showTab('classes')">Classes & Streams</button>
      <button class="navbtn" data-tab="promote" onclick="showTab('promote')">Promote Students</button>
      <button class="navbtn" data-tab="subjects" onclick="showTab('subjects')">Subjects</button>
      <button class="navbtn" data-tab="terms" onclick="showTab('terms')">Terms</button>
      <button class="navbtn" data-tab="students" onclick="showTab('students')">Students</button>
      <button class="navbtn" data-tab="teachers" onclick="showTab('teachers')">Teachers</button>
      <button class="navbtn" data-tab="attendance" onclick="showTab('attendance')">Attendance</button>
      <button class="navbtn" data-tab="reports" onclick="showTab('reports')">Reports</button>
      <button class="navbtn" data-tab="admins" onclick="showTab('admins')">Admins</button>
      <button class="navbtn" data-tab="settings" onclick="showTab('settings')">School Settings</button>
      <button class="navbtn" data-tab="grading" onclick="showTab('grading')">Grading</button>
      <button class="signout" onclick="signOut()">Sign out</button>
    </div>
    <div class="main" id="mainContent"></div>
  </div>
</div>

<!-- Generic modal -->
<div class="modal-bg" id="modalBg">
  <div class="modal" id="modalBox"></div>
</div>

<script>
/* ============================================================
   CONFIG
   ============================================================ */
const SUPABASE_URL = "https://efqstsysxpdkkxiarumf.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVmcXN0c3lzeHBka2t4aWFydW1mIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc4MjMyNzcsImV4cCI6MjEwMzM5OTI3N30.J0DrMc3zdbBXkOyoTw3je-GSPnW-ClEYZM16l27Y47k";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* Grading now comes from admin-configurable tables (CACHE.gradeBands,
   CACHE.divisionBands, CACHE.nurseryBands) loaded in loadAllData(). */
function gradeFor(score){
  if(score===null||score===undefined||score==='') return {grade:'-',point:null,comment:''};
  const s = parseFloat(score);
  for(const b of CACHE.gradeBands){ if(s>=b.min_score && s<=b.max_score) return {grade:b.label, point:b.point, comment:b.comment||''}; }
  return {grade:'-',point:null,comment:''};
}
function divisionFor(aggregate){
  for(const b of CACHE.divisionBands){ if(aggregate>=b.min_aggregate && aggregate<=b.max_aggregate) return b.label; }
  return '—';
}
function nurseryGradeFor(pct){
  if(pct===null||pct===undefined||isNaN(pct)) return {label:'-',comment:''};
  for(const b of CACHE.nurseryBands){ if(pct>=b.min_pct && pct<=b.max_pct) return {label:b.label, comment:b.comment||''}; }
  return {label:'-',comment:''};
}
function toRoman(n){
  const map = [[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']];
  n = parseInt(n); if(isNaN(n)||n<=0) return '';
  let out=''; for(const [val,sym] of map){ while(n>=val){ out+=sym; n-=val; } } return out;
}
function splitName(fullName){
  const parts = (fullName||'').trim().split(/\s+/);
  return { first: parts[0]||'', last: parts.slice(1).join(' ')||'' };
}
function personInitials(profileId){
  const t = CACHE.teachers.find(x=>x.id===profileId);
  const name = t ? t.full_name : (profileId===CURRENT_USER?.id ? CURRENT_PROFILE?.full_name : null);
  if(!name) return '—';
  return name.trim().split(/\s+/).map(w=>w[0]).join('.').toUpperCase()+'.';
}
function classTeacherNameFor(classId){
  const a = CACHE.assignments.find(x=>x.class_id===classId && x.is_class_teacher);
  return a ? teacherName(a.teacher_id) : '';
}

let CURRENT_USER = null;
let CURRENT_PROFILE = null;
let CACHE = { classes:[], streams:[], subjects:[], terms:[], students:[], teachers:[], assignments:[], gradeBands:[], divisionBands:[], nurseryBands:[] };
let SCHOOL_SETTINGS = {};

async function handleForgotPassword(){
  const email = document.getElementById('authEmail').value.trim();
  if(!email){ alert('Type your email in the Email field first, then click "Forgot password?"'); return; }
  const redirectTo = location.href.replace(/admin\.html.*$/, 'reset-password.html');
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo });
  if(error){ alert(error.message); return; }
  alert('If that email has an account, a password reset link has been sent. Check your inbox.');
}

async function loadBranding(){
  const { data } = await sb.from('school_settings').select('*').eq('id',1).maybeSingle();
  if(data){
    if(data.school_name){
      document.getElementById('brandName').textContent = data.school_name;
      document.title = data.school_name + ' — Admin';
    }
    if(data.motto) document.getElementById('brandMotto').textContent = data.motto;
  }
}
loadBranding();

/* ============================================================
   AUTH
   ============================================================ */
let authMode = 'signin';
function setAuthMode(mode){
  authMode = mode;
  document.getElementById('tabSignin').classList.toggle('active', mode==='signin');
  document.getElementById('tabSignup').classList.toggle('active', mode==='signup');
  document.getElementById('signupNameWrap').style.display = mode==='signup' ? 'block' : 'none';
  document.getElementById('authSubmitBtn').textContent = mode==='signup' ? 'Create teacher account' : 'Sign in';
  document.getElementById('authNote').textContent = mode==='signup'
    ? 'This creates your login. After signing up, ask the admin to assign you a class and subject before you can enter marks.'
    : 'Admins: sign in with the account created in Supabase. Teachers: use "Teacher sign up" to create your own login — the admin will then assign your class and subject.';
  document.getElementById('authError').textContent = '';
}

async function handleAuthSubmit(){
  const email = document.getElementById('authEmail').value.trim();
  const pass = document.getElementById('authPass').value;
  const errEl = document.getElementById('authError');
  errEl.textContent = '';
  if(!email || !pass){ errEl.textContent = 'Enter email and password.'; return; }

  const btn = document.getElementById('authSubmitBtn');
  btn.disabled = true;

  try{
    if(authMode === 'signup'){
      const name = document.getElementById('signupName').value.trim();
      if(!name){ errEl.textContent = 'Enter your full name.'; btn.disabled=false; return; }
      const { data, error } = await sb.auth.signUp({
        email, password: pass,
        options: { data: { full_name: name, self_registered: true } }
      });
      if(error) throw error;

      if(data.session){
        // Email confirmation is off — logged in immediately, create profile now.
        const { error: profErr } = await sb.from('profiles').insert({
          id: data.user.id, full_name: name, role: 'teacher'
        });
        if(profErr) throw profErr;
        await afterLogin();
        return;
      } else {
        // Email confirmation is on — no session yet. The profile will be
        // created automatically the first time they successfully sign in.
        errEl.style.color = 'var(--good)';
        errEl.textContent = 'Account created. Check your email to confirm it, then sign in.';
        setAuthMode('signin');
        btn.disabled=false;
        return;
      }
    } else {
      const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
      if(error) throw error;
      await afterLogin();
    }
  }catch(e){
    errEl.style.color = 'var(--pen-red)';
    errEl.textContent = e.message || 'Something went wrong.';
    btn.disabled = false;
  }
}

async function afterLogin(){
  const { data:{ user } } = await sb.auth.getUser();
  CURRENT_USER = user;
  let { data: profile, error } = await sb.from('profiles').select('*').eq('id', user.id).single();

  if((error || !profile) && user.user_metadata?.self_registered){
    // First successful login after a self sign-up (e.g. post email-confirmation).
    // Create their profile now that we have a real authenticated session.
    const { error: createErr } = await sb.from('profiles').insert({
      id: user.id,
      full_name: user.user_metadata.full_name || user.email,
      role: 'teacher'
    });
    if(!createErr){
      ({ data: profile, error } = await sb.from('profiles').select('*').eq('id', user.id).single());
    }
  }

  if(error || !profile){
    document.getElementById('authError').textContent = 'No profile found for this login. Ask the admin to check your account.';
    return;
  }
  CURRENT_PROFILE = profile;
  if(profile.role !== 'admin'){
    document.getElementById('loginScreen').style.display='flex';
    document.getElementById('app').style.display='none';
    document.getElementById('authError').style.color='var(--ink-soft)';
    document.getElementById('authError').textContent = 'This is the admin dashboard. Teacher marks-entry page is coming next — ask your admin.';
    return;
  }
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('app').style.display='block';
  await loadAllData();
  showTab('dashboard');
}

async function signOut(){
  await sb.auth.signOut();
  location.reload();
}

/* Check session on load */
(async function init(){
  const { data:{ session } } = await sb.auth.getSession();
  if(session){ await afterLogin(); }
})();

/* ============================================================
   DATA LOADING
   ============================================================ */
async function loadAllData(){
  const [c,s,sub,t,st,tc,as,settings,gb,db,nb] = await Promise.all([
    sb.from('classes').select('*').order('sort_order'),

/* Minimal CSV line parser — handles quoted fields containing commas */
function parseCSV(text){
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for(let i=0; i<text.length; i++){
    const c = text[i], next = text[i+1];
    if(inQuotes){
      if(c === '"' && next === '"'){ field += '"'; i++; }
      else if(c === '"'){ inQuotes = false; }
      else { field += c; }
    } else {
      if(c === '"'){ inQuotes = true; }
      else if(c === ','){ row.push(field); field=''; }
      else if(c === '\n' || c === '\r'){
        if(c === '\r' && next === '\n') i++;
        row.push(field); field='';
        if(row.length>1 || row[0]!=='') rows.push(row);
        row = [];
      } else { field += c; }
    }
  }
  if(field!=='' || row.length){ row.push(field); rows.push(row); }
  return rows;
}
async function handleStudentCSVImport(input){
  const file = input.files[0];
  if(!file) return;
  const statusEl = document.getElementById('importStatus');
  statusEl.innerHTML = '<div class="banner">Reading file…</div>';
  const text = await file.text();
  const rows = parseCSV(text);
  if(rows.length < 2){ statusEl.innerHTML = '<div class="banner">CSV looks empty.</div>'; input.value=''; return; }

  const header = rows[0].map(h=>h.trim().toLowerCase());
  const idx = {
    first: header.indexOf('first name'),
    last: header.indexOf('last name'),
    fullLegacy: header.indexOf('full name'),
    adm: header.indexOf('admission no'),
    gender: header.indexOf('gender'),
    dob: header.indexOf('dob'),
    cls: header.indexOf('class'),
    stream: header.indexOf('stream'),
    guardian: header.indexOf('guardian name'),
    contact: header.indexOf('guardian contact'),
    status: header.indexOf('status'),
  };
  if((idx.first===-1 && idx.fullLegacy===-1) || idx.cls===-1){
    statusEl.innerHTML = '<div class="banner">CSV must have at least "First Name" and "Class" columns. Use the Import template button to get the right format.</div>';
    input.value=''; return;
  }

  const toInsert = [];
  const errors = [];
  for(let r=1; r<rows.length; r++){
    const row = rows[r];
    if(!row || row.every(c=>c.trim()==='')) continue;
    let first_name, last_name;
    if(idx.first>-1){
      first_name = (row[idx.first]||'').trim();
      last_name = idx.last>-1 ? (row[idx.last]||'').trim() : '';
    } else {
      // Legacy "Full Name" column — best-effort split
      const full = (row[idx.fullLegacy]||'').trim();
      const parts = full.split(' ');
      first_name = parts[0]||'';
      last_name = parts.slice(1).join(' ');
    }
    const clsName = (row[idx.cls]||'').trim();
    if(!first_name){ errors.push(`Row ${r+1}: missing first name, skipped.`); continue; }
    const cls = CACHE.classes.find(c=>c.name.toLowerCase()===clsName.toLowerCase());
    if(!cls){ errors.push(`Row ${r+1} (${first_name} ${last_name}): class "${clsName}" not found, skipped.`); continue; }
    let stream_id = null;
    const streamName_ = idx.stream>-1 ? (row[idx.stream]||'').trim() : '';
    if(streamName_){
      const strm = CACHE.streams.find(s=>s.class_id===cls.id && s.name.toLowerCase()===streamName_.toLowerCase());
      if(strm) stream_id = strm.id;
      else errors.push(`Row ${r+1} (${first_name} ${last_name}): stream "${streamName_}" not found in ${cls.name}, left blank.`);
    }
    const genderRaw = idx.gender>-1 ? (row[idx.gender]||'').trim().toUpperCase() : '';
    toInsert.push({
      first_name,
      last_name: last_name || null,
      full_name: [first_name, last_name].filter(Boolean).join(' '),
      admission_no: idx.adm>-1 ? ((row[idx.adm]||'').trim()||null) : null,
      gender: (genderRaw==='M'||genderRaw==='F') ? genderRaw : null,
      dob: idx.dob>-1 ? ((row[idx.dob]||'').trim()||null) : null,
      class_id: cls.id,
      stream_id,
      guardian_name: idx.guardian>-1 ? ((row[idx.guardian]||'').trim()||null) : null,
      guardian_contact: idx.contact>-1 ? ((row[idx.contact]||'').trim()||null) : null,
      status: (idx.status>-1 && ['active','promoted','left'].includes((row[idx.status]||'').trim().toLowerCase())) ? (row[idx.status]||'').trim().toLowerCase() : 'active',
    });
  }

  if(toInsert.length===0){
    statusEl.innerHTML = `<div class="banner">Nothing to import.<br>${errors.join('<br>')}</div>`;
    input.value=''; return;
  }

  statusEl.innerHTML = `<div class="banner">Importing ${toInsert.length} students…</div>`;
  const { error } = await sb.from('students').insert(toInsert);
  input.value = '';
  if(error){
    statusEl.innerHTML = `<div class="banner" style="border-color:#e8c3bd;color:var(--pen-red);">Import failed: ${error.message}</div>`;
    return;
  }
  statusEl.innerHTML = `<div class="banner">✅ Imported ${toInsert.length} students.${errors.length ? '<br><br>Notes:<br>'+errors.join('<br>') : ''}</div>`;
  showTab('students');
}
async function saveStudent(id){
  const first_name = document.getElementById('f_first').value.trim();
  const last_name = document.getElementById('f_last').value.trim();
  if(!first_name){ document.getElementById('f_err').textContent='First name is required.'; return; }
  const full_name = [first_name, last_name].filter(Boolean).join(' ');
  const errEl = document.getElementById('f_err');

  let photo_url = document.getElementById('f_photo_url').value || null;
  const fileInput = document.getElementById('f_photo');
  if(fileInput.files && fileInput.files[0]){
    errEl.style.color = 'var(--ink-soft)';
    errEl.textContent = 'Uploading photo…';
    const file = fileInput.files[0];
    const path = `${Date.now()}_${file.name.replace(/[^a-zA-Z0-9._-]/g,'')}`;
    const { error: upErr } = await sb.storage.from('student-photos').upload(path, file, { upsert:true });
    if(upErr){ errEl.style.color='var(--pen-red)'; errEl.textContent = 'Photo upload failed: ' + upErr.message; return; }
    const { data: pub } = sb.storage.from('student-photos').getPublicUrl(path);
    photo_url = pub.publicUrl;
    errEl.textContent = '';
  }

  const payload = {
    first_name,
    last_name: last_name || null,
    full_name,
    photo_url,
    admission_no: document.getElementById('f_adm').value.trim() || null,
    lin: document.getElementById('f_lin').value.trim() || null,
    student_pay_code: document.getElementById('f_paycode').value.trim() || null,

    class_id: document.getElementById('f_class').value || null,
    stream_id: document.getElementById('f_stream').value || null,
    guardian_name: document.getElementById('f_guardian').value.trim() || null,
    guardian_contact: document.getElementById('f_contact').value.trim() || null,
    status: document.getElementById('f_status').value,
  };
  const { error } = id ? await sb.from('students').update(payload).eq('id',id) : await sb.from('students').insert(payload);
  if(error){ errEl.style.color='var(--pen-red)'; errEl.textContent = error.message; return; }

let promoteFromClass='';
function nextClassFor(classId){
  const sorted = [...CACHE.classes].sort((a,b)=>a.sort_order-b.sort_order);
  const idx = sorted.findIndex(c=>c.id===classId);
  if(idx===-1) return null;
  return sorted[idx+1] || null; // null = final class (e.g. P7)
}
function renderPromote(){
  const main = document.getElementById('mainContent');
  main.innerHTML = `
    <div class="topline"><div><h2>Promote Students</h2><p>Move a whole class up to the next class at the end of the year</p></div></div>
    <div class="filters">
      <select id="promoteClassSelect" onchange="promoteFromClass=this.value; renderPromoteList();">
        <option value="">Choose class to promote…</option>
        ${CACHE.classes.map(c=>`<option value="${c.id}" ${promoteFromClass===c.id?'selected':''}>${c.name}</option>`).join('')}
      </select>
    </div>
    <div id="promoteArea"></div>
  `;
  if(promoteFromClass) renderPromoteList();
}
function renderPromoteList(){
  const area = document.getElementById('promoteArea');
  const students = CACHE.students.filter(s=>s.class_id===promoteFromClass && s.status==='active');
  const next = nextClassFor(promoteFromClass);

  if(students.length===0){ area.innerHTML = '<div class="empty">No active students in this class.</div>'; return; }

  area.innerHTML = `
    <div class="banner">
      ${next
        ? `These students will move from <b>${className(promoteFromClass)}</b> to <b>${next.name}</b>. Untick anyone repeating the class.`
        : `<b>${className(promoteFromClass)}</b> is the final class — these students will be marked as completed/promoted and removed from the active roll (their records stay in the system). Untick anyone repeating.`
      }
    </div>
    <div class="card">
      <table>
        <thead><tr><th style="width:36px;"><input type="checkbox" checked onchange="toggleAllPromote(this)"></th><th>Student</th><th>Current stream</th></tr></thead>
        <tbody>
        ${students.map(st=>`<tr>
          <td><input type="checkbox" class="promote-cb" value="${st.id}" checked></td>
          <td>${st.full_name}</td>
          <td>${streamName(st.stream_id)||'—'}</td>
        </tr>`).join('')}
        </tbody>
      </table>
    </div>
    <div style="margin-top:14px;">
      <button class="btn btn-add" onclick="runPromotion()">Promote ${students.length} checked students</button>
    </div>
  `;
}
function toggleAllPromote(master){
  document.querySelectorAll('.promote-cb').forEach(cb=>cb.checked = master.checked);
}
async function runPromotion(){
  const checked = Array.from(document.querySelectorAll('.promote-cb:checked')).map(cb=>cb.value);
  if(checked.length===0){ alert('No students selected.'); return; }
  const next = nextClassFor(promoteFromClass);
  if(!confirm(`Promote ${checked.length} student(s)${next? ' to '+next.name : ' as completed/graduated'}? This cannot be undone automatically.`)) return;

  let error;
  if(next){
    // try to match a stream of the same name in the destination class; else leave blank
    for(const studentId of checked){
      const st = CACHE.students.find(s=>s.id===studentId);
      const curStreamName = streamName(st.stream_id);
      const matchStream = curStreamName ? CACHE.streams.find(s=>s.class_id===next.id && s.name===curStreamName) : null;
      const { error: e } = await sb.from('students').update({
        class_id: next.id,
        stream_id: matchStream ? matchStream.id : null,
      }).eq('id', studentId);
      if(e) error = e;
    }
  } else {
    const { error: e } = await sb.from('students').update({ status: 'promoted' }).in('id', checked);
    error = e;
  }
  if(error){ alert(error.message); return; }
  alert('Done.');
  showTab('promote');
}

async function adminSaveMark(studentId, subjectId, value){
  const val = value.trim();
  if(val===''){ return; }
  const score = parseFloat(val);
  if(isNaN(score)||score<0||score>100){ alert('Score must be between 0 and 100.'); return; }
  const { error } = await sb.from('marks').upsert({
    student_id: studentId, subject_id: subjectId, term_id: reportTerm, assessment_type: 'eot', score, entered_by: CURRENT_USER.id
  }, { onConflict:'student_id,subject_id,term_id,assessment_type' });
  if(error){ alert('Could not save: ' + error.message); }
}
function downloadCSV(filename, rows){
  const csv = rows.map(r => r.map(cell => `"${String(cell??'').replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
}
async function exportClassMarksCSV(){
  const studentsInClass = CACHE.students.filter(s=>s.class_id===reportClass && s.status==='active');
  const { data: marks } = await sb.from('marks').select('*').eq('term_id', reportTerm).eq('assessment_type','eot');
  const term = CACHE.terms.find(t=>t.id===reportTerm);
  const header = ['Student', ...CACHE.subjects.map(s=>s.name), 'Average'];
  const rows = [header];
  studentsInClass.forEach(st=>{
    const scores = CACHE.subjects.map(sub=>{
      const m = (marks||[]).find(mk=>mk.student_id===st.id && mk.subject_id===sub.id);
      return m ? m.score : '';
    });
    const valid = scores.filter(v=>v!=='');
    const avg = valid.length ? (valid.reduce((a,b)=>a+parseFloat(b),0)/valid.length).toFixed(1) : '';
    rows.push([st.full_name, ...scores, avg]);
  });
  downloadCSV(`${className(reportClass)}_${term?term.name+'_'+term.year:'marks'}.csv`, rows);
}
function schoolHeaderHTML(){

/* ---------- Lower Primary (P1-P3) & Upper Primary (P4-P7) ---------- */
function buildPrimaryReportHTML(student, marksAll, commentRow, term, posInfo, showGradingKey){
  const orderedSubjects = CACHE.subjects.filter(s=>marksAll.some(m=>m.subject_id===s.id));
  const eotMarks = marksAll.filter(m=>m.assessment_type==='eot');
  const topicalMarks = marksAll.filter(m=>m.assessment_type==='topical');
  const midtermMarks = marksAll.filter(m=>m.assessment_type==='midterm');
  const markFor = (list, subjectId) => list.find(m=>m.subject_id===subjectId);

  let totalFullMarks=0, totalEOT=0, totalAgg=0;
  const eotRows = orderedSubjects.map(sub=>{
    const m = markFor(eotMarks, sub.id);
    const score = m ? parseFloat(m.score) : null;
    const g = gradeFor(score);
    totalFullMarks += 100;
    if(score!==null){ totalEOT += score; totalAgg += (g.point||0); }
    return `<tr><td>${sub.name}</td><td class="num">100</td><td class="num">${score!==null?score:'—'}</td><td class="num grade-${g.grade}">${g.point!==null?g.point:'—'}</td><td>${g.comment||''}</td><td class="num">${m?personInitials(m.entered_by):'—'}</td></tr>`;
  }).join('') || `<tr><td colspan="6" class="empty">No marks entered yet</td></tr>`;
  const division = divisionFor(totalAgg);

  const hasTopicalOrMid = topicalMarks.length>0 || midtermMarks.length>0;
  let subjHeaders='', topRow={html:'',tm:0,ta:0}, midRow={html:'',tm:0,ta:0}, topicalTM=0, midTM=0;
  if(hasTopicalOrMid){
    subjHeaders = orderedSubjects.map(s=>`<th class="num">${s.code||s.name}</th><th class="num">Agg</th>`).join('');
    function assessRow(label, list){
      let tm=0, ta=0;
      const cells = orderedSubjects.map(sub=>{
        const m = markFor(list, sub.id);
        const score = m? parseFloat(m.score) : null;
        const g = gradeFor(score);
        if(score!==null){ tm+=score; ta+=(g.point||0); }
        return `<td class="num">${score!==null?score:'—'}</td><td class="num">${g.point!==null?g.point:'—'}</td>`;
      }).join('');
      return { html: `<tr><td>${label}</td>${cells}<td class="num">${tm}</td><td class="num">${ta}</td><td>${divisionFor(ta)}</td></tr>`, tm, ta };
    }
    topRow = assessRow('TOPICAL TESTS', topicalMarks);
    midRow = assessRow('MID TERM', midtermMarks);
    topicalTM = topRow.tm; midTM = midRow.tm;
  }
  const totalAvgMark = hasTopicalOrMid
    ? (((totalEOT + topicalTM + midTM) / 3).toFixed(1))
    : (orderedSubjects.length ? (totalEOT/orderedSubjects.length).toFixed(1) : '—');

  const positionBlock = posInfo ? `<div style="margin-top:4px;font-size:12.5px;"><b>Position: ${ordinal(posInfo.position)} out of ${posInfo.total}</b></div>` : '';
  const gradingKeyHTML = showGradingKey ? `
    <table style="margin-top:14px;">
      <thead><tr>${CACHE.gradeBands.map(b=>`<th class="num">${b.min_score}-${b.max_score}</th>`).join('')}</tr></thead>
      <tbody><tr>${CACHE.gradeBands.map(b=>`<td class="num"><b>${b.label}</b></td>`).join('')}</tr></tbody>
    </table>
  ` : '';
  const classTeacher = classTeacherNameFor(student.class_id);

  return `
    <div class="report-card report-card-print">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;">
        <div style="flex:1;">${schoolHeaderHTML()}</div>
        ${student.photo_url?`<img src="${student.photo_url}" class="student-photo-lg">`:''}
      </div>
      ${reportTitleHTML(term)}
      ${studentIdentityBlockHTML(student, term)}

      <div class="rc-box">
        <div class="rc-box-title">EOT TERM RESULTS</div>
        <table>
          <thead><tr><th>Subject</th><th class="num">Full Mark</th><th class="num">EOT</th><th class="num">Agg</th><th>Remark</th><th class="num">Init.</th></tr></thead>
          <tbody>${eotRows}</tbody>
          <tfoot><tr style="font-weight:700;"><td>Total</td><td class="num">${totalFullMarks}</td><td class="num">${totalEOT}</td><td class="num">${totalAgg}</td><td></td><td></td></tr></tfoot>
        </table>
        <div style="padding:5px 8px;font-size:11.5px;"><b>Division: ${division}</b></div>
      </div>

      ${hasTopicalOrMid ? `
      <div class="rc-box">
        <div class="rc-box-title">TOPICAL AND MID TERM EXAM</div>
        <table>
          <thead><tr><th>Subject</th>${subjHeaders}<th class="num">TM</th><th class="num">TA</th><th>DIV</th></tr></thead>
          <tbody>${topRow.html}${midRow.html}</tbody>
        </table>
      </div>` : ''}

      <div class="rc-field-row" style="margin-top:8px;">
        <div class="rc-field" style="flex:1 1 60%;"><b>Total Average Mark</b>${totalAvgMark}</div>
        <div class="rc-field"><b>Position</b>${posInfo ? `${ordinal(posInfo.position)} out of ${posInfo.total}` : '—'}</div>
      </div>

      <div class="rc-box">
        <div class="rc-box-title">REMARKS</div>
        <div class="comments" style="padding:6px 10px;margin-top:0;">
          <div><b>Class Teacher's Name:</b> ${classTeacher||'—'}</div>
          <div style="margin-top:3px;"><b>Teacher's Comment:</b> ${commentRow?.class_teacher_comment || '<span style="color:var(--ink-soft);">Not yet added</span>'}</div>
          <div style="margin-top:6px;"><b>Head Teacher's Name:</b> ${SCHOOL_SETTINGS.head_teacher_name||'—'}</div>
          <div style="margin-top:3px;"><b>Head Teacher's Comment:</b> ${commentRow?.head_teacher_comment || '<span style="color:var(--ink-soft);">Not yet added</span>'}</div>
        </div>
      </div>

      <div class="rc-signoff">
        <div>${nextTermLine(term)}</div>
        <div>Head Teacher's Signature: ______________________</div>
      </div>
      ${gradingKeyHTML}
    </div>
  `;
}

/* Picks the right template based on the student's class's report level */
function buildReportCardHTML(student, marksAll, commentRow, term, posInfo){
  const cls = CACHE.classes.find(c=>c.id===student.class_id);
  const level = cls?.level;
  if(level === 'nursery') return buildNurseryReportHTML(student, marksAll||[], commentRow, term, posInfo);
  return buildPrimaryReportHTML(student, marksAll||[], commentRow, term, posInfo, level==='upper_primary');
}

function ordinal(n){
  const s = ['th','st','nd','rd'];
  const v = n % 100;
  return n + (s[(v-20)%10] || s[v] || s[0]);
}

/* Ranks every active student in a class by their EOT average for a term.
   Ties share the same position (1,2,2,4 style). Students with no marks
   entered yet are excluded from ranking. */
async function computeClassPositions(classId, termId){
  const studentsInClass = CACHE.students.filter(s=>s.class_id===classId && s.status==='active');
  if(studentsInClass.length===0) return {};
  const { data: marks } = await sb.from('marks').select('*').eq('term_id', termId).eq('assessment_type','eot').in('student_id', studentsInClass.map(s=>s.id));
  const stats = studentsInClass.map(st=>{
    const own = (marks||[]).filter(m=>m.student_id===st.id).map(m=>parseFloat(m.score));
    const avg = own.length ? own.reduce((a,b)=>a+b,0)/own.length : null;
    return { id: st.id, avg };
  });
  const ranked = stats.filter(s=>s.avg!==null).sort((a,b)=>b.avg-a.avg);
  const posMap = {};
  let lastAvg=null, lastPos=0;
  ranked.forEach((s,i)=>{
    if(s.avg!==lastAvg){ lastPos = i+1; lastAvg = s.avg; }
    posMap[s.id] = { position: lastPos, total: ranked.length };
  });
  return posMap;
}

async function openReportCard(studentId){
  const student = CACHE.students.find(s=>s.id===studentId);
  const { data: marks } = await sb.from('marks').select('*').eq('student_id',studentId).eq('term_id',reportTerm);

  const term = CACHE.terms.find(t=>t.id===reportTerm);
  const posMap = await computeClassPositions(student.class_id, reportTerm);

  document.getElementById('reportCardArea').innerHTML = `
    <div id="printableReport">${buildReportCardHTML(student, marks, commentRow, term, posMap[studentId])}</div>

}

  const studentsInClass = CACHE.students.filter(s=>s.class_id===reportClass && s.status==='active');
  if(studentsInClass.length===0){ alert('No active students in this class.'); return; }
  const term = CACHE.terms.find(t=>t.id===reportTerm);

  const [{data: allMarks}, {data: allComments}, posMap] = await Promise.all([
    sb.from('marks').select('*').eq('term_id', reportTerm),
    sb.from('report_comments').select('*').eq('term_id', reportTerm),

async function saveComments(studentId){
  const payload = {
    class_teacher_comment: document.getElementById('f_ct').value.trim(),
    head_teacher_comment: document.getElementById('f_ht').value.trim(),
  };
  const behEl = document.getElementById('f_beh_g');
  if(behEl){
    payload.behaviour_grade = behEl.value || null;
    payload.behaviour_comment = document.getElementById('f_beh_c').value.trim() || null;
    payload.pe_grade = document.getElementById('f_pe_g').value || null;
    payload.pe_comment = document.getElementById('f_pe_c').value.trim() || null;
    payload.cleanliness_grade = document.getElementById('f_cl_g').value || null;
    payload.cleanliness_comment = document.getElementById('f_cl_c').value.trim() || null;
  }
  const { data: existing } = await sb.from('report_comments').select('id').eq('student_id',studentId).eq('term_id',reportTerm).maybeSingle();
  let error;
  if(existing){
    ({error} = await sb.from('report_comments').update(payload).eq('id',existing.id));
  } else {
    ({error} = await sb.from('report_comments').insert({student_id:studentId, term_id:reportTerm, ...payload}));
  }
  if(error){ document.getElementById('f_err').textContent = error.message; return; }
  closeModal(); openReportCard(studentId);
}

      ${CACHE.gradeBands.map(b=>`<tr>
        <td class="num">${b.min_score}–${b.max_score}</td><td><b>${b.label}</b></td><td class="num">${b.point??'—'}</td><td>${b.comment||'—'}</td>
        <td><button class="btn-small" onclick="openGradeBandModal('grade_bands','${b.id}')">Edit</button><button class="btn-small danger" onclick="deleteRow('grade_bands','${b.id}','grade band')">Delete</button></td>
      </tr>`).join('') || '<tr><td colspan="5" class="empty">No bands yet</td></tr>'}
      </tbody></table>
    </div>
    <button class="btn btn-ghost" style="margin-bottom:26px;" onclick="openGradeBandModal('grade_bands')">+ Add subject grade band</button>

    <h3 style="font-size:16px;color:var(--chalk-green);margin:0 0 8px;">Overall Division (Lower & Upper Primary)</h3>
    <p style="font-size:12.5px;color:var(--ink-soft);margin:-4px 0 10px;">Based on the total of every subject's point value on that report card.</p>
    <div class="card" style="margin-bottom:10px;">
      <table><thead><tr><th>Aggregate range</th><th>Division label</th><th></th></tr></thead>
      <tbody>
      ${CACHE.divisionBands.map(b=>`<tr>
        <td class="num">${b.min_aggregate}–${b.max_aggregate}</td><td><b>${b.label}</b></td>
        <td><button class="btn-small" onclick="openGradeBandModal('division_bands','${b.id}')">Edit</button><button class="btn-small danger" onclick="deleteRow('division_bands','${b.id}','division band')">Delete</button></td>
      </tr>`).join('') || '<tr><td colspan="3" class="empty">No bands yet</td></tr>'}
      </tbody></table>
    </div>
    <button class="btn btn-ghost" style="margin-bottom:26px;" onclick="openGradeBandModal('division_bands')">+ Add division band</button>

    <h3 style="font-size:16px;color:var(--chalk-green);margin:0 0 8px;">Nursery overall grade (A–D)</h3>
    <p style="font-size:12.5px;color:var(--ink-soft);margin:-4px 0 10px;">Based on the student's overall percentage across all Learning Areas.</p>
    <div class="card">
      <table><thead><tr><th>Percentage range</th><th>Label</th><th></th></tr></thead>
      <tbody>
      ${CACHE.nurseryBands.map(b=>`<tr>
        <td class="num">${b.min_pct}%–${b.max_pct}%</td><td><b>${b.label}</b></td>
        <td><button class="btn-small" onclick="openGradeBandModal('nursery_grade_bands','${b.id}')">Edit</button><button class="btn-small danger" onclick="deleteRow('nursery_grade_bands','${b.id}','nursery band')">Delete</button></td>
      </tr>`).join('') || '<tr><td colspan="3" class="empty">No bands yet</td></tr>'}
      </tbody></table>
    </div>
    <button class="btn btn-ghost" style="margin-top:10px;" onclick="openGradeBandModal('nursery_grade_bands')">+ Add nursery band</button>
  `;
}

function openGradeBandModal(table, id){
  const cacheKey = { grade_bands:'gradeBands', division_bands:'divisionBands', nursery_grade_bands:'nurseryBands' }[table];
  const row = id ? CACHE[cacheKey].find(b=>b.id===id) : null;

  let fields = '';
  if(table === 'grade_bands'){
    fields = `
      <label>Minimum score</label><input id="f_min" type="number" value="${row?row.min_score:''}">
      <label>Maximum score</label><input id="f_max" type="number" value="${row?row.max_score:''}">
      <label>Label (e.g. D1)</label><input id="f_label" value="${row?row.label:''}">
      <label>Point value (used for aggregate — lower is usually better)</label><input id="f_point" type="number" value="${row&&row.point!=null?row.point:''}">
      <label>Comment (optional)</label><input id="f_comment" value="${row?row.comment||'':''}">
    `;
  } else if(table === 'division_bands'){
    fields = `
      <label>Minimum aggregate</label><input id="f_min" type="number" value="${row?row.min_aggregate:''}">
      <label>Maximum aggregate</label><input id="f_max" type="number" value="${row?row.max_aggregate:''}">
      <label>Division label (e.g. Division One)</label><input id="f_label" value="${row?row.label:''}">
    `;
  } else {
    fields = `
      <label>Minimum percentage</label><input id="f_min" type="number" value="${row?row.min_pct:''}">
      <label>Maximum percentage</label><input id="f_max" type="number" value="${row?row.max_pct:''}">
      <label>Label (e.g. A)</label><input id="f_label" value="${row?row.label:''}">
    `;
  }

  openModal(`
    <h3>${row?'Edit':'Add'} band</h3>
    ${fields}
    <div class="field-error" id="f_err"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-add" onclick="saveGradeBand('${table}','${id||''}')">Save</button>
    </div>
  `);
}
async function saveGradeBand(table, id){
  const min = parseFloat(document.getElementById('f_min').value);
  const max = parseFloat(document.getElementById('f_max').value);
  const label = document.getElementById('f_label').value.trim();
  if(isNaN(min)||isNaN(max)||!label){ document.getElementById('f_err').textContent='Fill in the range and a label.'; return; }

  let payload;
  if(table === 'grade_bands'){
    const pointVal = document.getElementById('f_point').value;
    payload = { min_score:min, max_score:max, label, point: pointVal===''?null:parseInt(pointVal), comment: document.getElementById('f_comment').value.trim()||null, sort_order: id? undefined : (CACHE.gradeBands.length+1) };
  } else if(table === 'division_bands'){
    payload = { min_aggregate:min, max_aggregate:max, label, sort_order: id? undefined : (CACHE.divisionBands.length+1) };
  } else {
    payload = { min_pct:min, max_pct:max, label, sort_order: id? undefined : (CACHE.nurseryBands.length+1) };
  }
  if(payload.sort_order === undefined) delete payload.sort_order;

  const { error } = id ? await sb.from(table).update(payload).eq('id',id) : await sb.from(table).insert(payload);
  if(error){ document.getElementById('f_err').textContent = error.message; return; }
  closeModal(); showTab('grading');
}

async function renderSettings(){
  const main = document.getElementById('mainContent');
  main.innerHTML = '<div class="loading">Loading…</div>';
  const { data: s } = await sb.from('school_settings').select('*').eq('id',1).maybeSingle();
  main.innerHTML = `
    <div class="topline"><div><h2>School Settings</h2><p>Shown on the login screen and printed report cards</p></div></div>
    <div class="card card-pad" style="max-width:480px;">
      <label>School name</label>
      <input id="s_name" value="${s?.school_name||''}">
      <label>Motto (optional)</label>
      <input id="s_motto" value="${s?.motto||''}">
      <label>Address (optional)</label>
      <input id="s_address" value="${s?.address||''}">
      <label>Phone (optional)</label>
      <input id="s_phone" value="${s?.phone||''}">
      <label>Email (optional)</label>
      <input id="s_email" value="${s?.email||''}">
      <label>Head Teacher's name (optional, printed on report cards)</label>
      <input id="s_headteacher" value="${s?.head_teacher_name||''}">
      <label>School logo (optional)</label>
      <input id="s_logo_file" type="file" accept="image/*" onchange="previewLogo(this)">
      <img id="logoPreview" class="photo-preview" style="border-radius:6px;width:auto;max-width:160px;height:auto;max-height:90px;" src="${s?.logo_url||''}" style="display:${s?.logo_url?'block':'none'};">
      <input type="hidden" id="s_logo_url" value="${s?.logo_url||''}">
      <div class="field-error" id="s_err"></div>
      <button class="btn btn-add" style="margin-top:16px;" onclick="saveSettings()">Save</button>
    </div>
  `;
}
function previewLogo(input){
  if(!input.files || !input.files[0]) return;
  const reader = new FileReader();
  reader.onload = e => {
    const img = document.getElementById('logoPreview');
    img.src = e.target.result;
    img.style.display = 'block';
  };
  reader.readAsDataURL(input.files[0]);
}
async function saveSettings(){
  const errEl = document.getElementById('s_err');
  errEl.style.color = 'var(--pen-red)';
  let logo_url = document.getElementById('s_logo_url').value || null;

  const fileInput = document.getElementById('s_logo_file');
  if(fileInput.files && fileInput.files[0]){
    errEl.style.color = 'var(--ink-soft)';
    errEl.textContent = 'Uploading logo…';
    const file = fileInput.files[0];
    const path = `logo_${Date.now()}_${file.name.replace(/[^a-zA-Z0-9._-]/g,'')}`;
    const { error: upErr } = await sb.storage.from('school-assets').upload(path, file, { upsert:true });
    if(upErr){ errEl.style.color='var(--pen-red)'; errEl.textContent = 'Logo upload failed: ' + upErr.message; return; }
    const { data: pub } = sb.storage.from('school-assets').getPublicUrl(path);
    logo_url = pub.publicUrl;
    errEl.textContent = '';
  }

  const payload = {
    id: 1,
    school_name: document.getElementById('s_name').value.trim() || 'My School',
    motto: document.getElementById('s_motto').value.trim() || null,
    address: document.getElementById('s_address').value.trim() || null,
    phone: document.getElementById('s_phone').value.trim() || null,
    email: document.getElementById('s_email').value.trim() || null,
    head_teacher_name: document.getElementById('s_headteacher').value.trim() || null,
    logo_url,
  };
  const { data: existing } = await sb.from('school_settings').select('id').eq('id',1).maybeSingle();
  const { error } = existing
    ? await sb.from('school_settings').update(payload).eq('id',1)
    : await sb.from('school_settings').insert(payload);
  if(error){ errEl.style.color='var(--pen-red)'; errEl.textContent = error.message; return; }
  errEl.textContent = '';
  alert('Saved.');
}

/* ============================================================
   MODAL + DELETE HELPERS
   ============================================================ */
function openModal(html){
  document.getElementById('modalBox').innerHTML = html;
  document.getElementById('modalBg').classList.add('show');
}
function closeModal(){ document.getElementById('modalBg').classList.remove('show'); }
document.getElementById('modalBg').addEventListener('click', e=>{ if(e.target.id==='modalBg') closeModal(); });

async function deleteRow(table, id, label){
  if(!confirm(`Delete this ${label}? This cannot be undone.`)) return;
  const { error } = await sb.from(table).delete().eq('id', id);
  if(error){ alert(error.message); return; }
  const tabMap = { classes:'classes', subjects:'subjects', terms:'terms', students:'students', teacher_assignments:'teachers', grade_bands:'grading', division_bands:'grading', nursery_grade_bands:'grading' };
  showTab(tabMap[table] || 'dashboard');
}
</script>
