<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>School Admin — Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --chalk-green:#1F3D2B;
    --chalk-green-light:#2C5540;
    --dust:#F2EFE6;
    --paper:#FFFFFF;
    --pen-red:#C1392B;
    --pen-red-dark:#a12e22;
    --rule-blue:#4A6FA5;
    --ink:#2B2B24;
    --ink-soft:#6b6a5f;
    --border:#E1DCC9;
    --good:#2E7D4F;
    --warn:#C1392B;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'IBM Plex Sans',Segoe UI,Arial,sans-serif;
    background:var(--dust);
    color:var(--ink);
  }
  @font-face{}
  h1,h2,h3,.brand{
    font-family:'Zilla Slab',Georgia,serif;
  }
  .num{font-family:'IBM Plex Mono',monospace;}

  /* ---------- Login ---------- */
  #loginScreen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--chalk-green);
    background-image:
      linear-gradient(var(--chalk-green-light) 1px, transparent 1px),
      linear-gradient(90deg, var(--chalk-green-light) 1px, transparent 1px);
    background-size:28px 28px;
    padding:20px;
  }
  .login-card{
    background:var(--dust);
    border-radius:6px;
    padding:36px 32px;
    width:100%;
    max-width:380px;
    box-shadow:0 20px 50px rgba(0,0,0,0.35);
    border-top:6px solid var(--pen-red);
  }
  .login-card h1{
    margin:0 0 4px;
    font-size:28px;
    color:var(--chalk-green);
  }
  .login-card p.sub{
    margin:0 0 24px;
    color:var(--ink-soft);
    font-size:14px;
  }
  .tabs-auth{display:flex;gap:8px;margin-bottom:20px;}
  .tabs-auth button{
    flex:1;padding:8px;border-radius:4px;border:1px solid var(--border);
    background:var(--paper);cursor:pointer;font-size:13px;color:var(--ink-soft);
  }
  .tabs-auth button.active{background:var(--chalk-green);color:#fff;border-color:var(--chalk-green);}
  label{display:block;font-size:13px;margin:14px 0 6px;color:var(--ink-soft);font-weight:600;}
  input,select,textarea{
    width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:4px;
    font-size:15px;background:var(--paper);color:var(--ink);font-family:inherit;
  }
  input:focus,select:focus,textarea:focus{outline:2px solid var(--rule-blue);outline-offset:1px;}
  button.primary{
    margin-top:22px;width:100%;padding:12px;background:var(--pen-red);color:#fff;
    border:none;border-radius:4px;font-size:15px;font-weight:600;cursor:pointer;
  }
  button.primary:hover{background:var(--pen-red-dark);}
  button.primary:disabled{opacity:0.6;cursor:default;}
  .login-error{color:var(--pen-red);font-size:13px;margin-top:12px;min-height:16px;}
  .login-note{font-size:12px;color:var(--ink-soft);margin-top:16px;line-height:1.5;}

  /* ---------- App shell ---------- */
  #app{display:none;min-height:100vh;}
  .shell{display:flex;min-height:100vh;}
  .sidebar{
    width:220px;flex-shrink:0;background:var(--chalk-green);color:#fff;
    padding:22px 14px;position:sticky;top:0;height:100vh;overflow-y:auto;
  }
  .sidebar .brand{font-size:19px;margin:0 8px 4px;color:#fff;}
  .sidebar .brand-sub{font-size:11px;margin:0 8px 22px;color:#c9dccd;letter-spacing:.04em;text-transform:uppercase;}
  .navbtn{
    display:block;width:100%;text-align:left;padding:11px 12px;border-radius:5px;border:none;
    background:transparent;color:#e7efe8;font-size:14.5px;cursor:pointer;margin-bottom:2px;
  }
  .navbtn:hover{background:var(--chalk-green-light);}
  .navbtn.active{background:var(--pen-red);color:#fff;font-weight:600;}
  .sidebar .signout{margin-top:20px;font-size:12.5px;color:#c9dccd;background:none;border:1px solid #47654f;padding:8px;border-radius:4px;width:100%;cursor:pointer;}
  .sidebar .signout:hover{background:var(--chalk-green-light);}

  .main{flex:1;padding:26px 30px;max-width:1100px;}
  .topline{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:22px;flex-wrap:wrap;gap:10px;}
  .topline h2{margin:0 0 4px;font-size:24px;color:var(--chalk-green);}
  .topline p{margin:0;color:var(--ink-soft);font-size:13.5px;}
  .btn{padding:9px 16px;border-radius:5px;border:none;font-size:14px;cursor:pointer;font-weight:600;}
  .btn-add{background:var(--pen-red);color:#fff;}
  .btn-add:hover{background:var(--pen-red-dark);}
  .btn-ghost{background:transparent;border:1px solid var(--border);color:var(--ink);}
  .btn-ghost:hover{background:#fff;}
  .btn-small{padding:5px 10px;font-size:12.5px;border-radius:4px;border:1px solid var(--border);background:#fff;cursor:pointer;margin-right:6px;}
  .btn-small.danger{color:var(--pen-red);border-color:#e8c3bd;}
  .btn-small.danger:hover{background:#fdecea;}

  .card{background:var(--paper);border:1px solid var(--border);border-radius:6px;overflow:hidden;}
  table{width:100%;border-collapse:collapse;font-size:14px;}
  thead th{
    text-align:left;padding:11px 14px;background:#f8f6ee;color:var(--ink-soft);
    font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;border-bottom:2px solid var(--border);
  }
  tbody td{padding:11px 14px;border-bottom:1px solid var(--border);}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:#fbfaf5;}
  .pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:600;}
  .pill.active{background:#e4f3e9;color:var(--good);}
  .pill.left{background:#f3e4e4;color:var(--pen-red);}
  .pill.promoted{background:#e5eaf3;color:var(--rule-blue);}
  .empty{padding:36px 20px;text-align:center;color:var(--ink-soft);font-size:14px;}
  .loading{padding:36px 20px;text-align:center;color:var(--ink-soft);font-size:14px;}

  .filters{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
  .filters select{width:auto;min-width:150px;}

  /* Modal */
  .modal-bg{
    display:none;position:fixed;inset:0;background:rgba(31,61,43,0.55);
    align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;z-index:50;
  }
  .modal-bg.show{display:flex;}
  .modal{background:var(--paper);border-radius:8px;width:100%;max-width:460px;padding:26px 26px 24px;box-shadow:0 20px 50px rgba(0,0,0,0.3);}
  .modal h3{margin:0 0 18px;color:var(--chalk-green);font-size:19px;}
  .modal-actions{display:flex;gap:10px;margin-top:22px;}
  .modal-actions .btn{flex:1;}
  .modal .field-error{color:var(--pen-red);font-size:12.5px;margin-top:10px;}
  .checkbox-row{display:flex;align-items:center;gap:8px;margin-top:16px;}
  .checkbox-row input{width:auto;}
  .checkbox-row label{margin:0;font-weight:500;}

  .subtable{margin-top:10px;border-top:1px solid var(--border);padding-top:10px;}
  .subtable .row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:13.5px;}

  .grade-D1,.grade-D2{color:var(--good);font-weight:700;}
  .grade-C3,.grade-C4,.grade-C5{color:var(--rule-blue);font-weight:700;}
  .grade-C6,.grade-P7,.grade-P8{color:#b8860b;font-weight:700;}
  .grade-F9{color:var(--pen-red);font-weight:700;}
  .student-photo{width:34px;height:34px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:8px;border:1px solid var(--border);}
  .student-photo-lg{width:64px;height:64px;border-radius:50%;object-fit:cover;border:2px solid var(--border);float:right;}
  .photo-preview{width:70px;height:70px;border-radius:50%;object-fit:cover;border:1px solid var(--border);margin-top:8px;display:block;}
  .subject-checks{display:flex;flex-direction:column;gap:6px;max-height:160px;overflow-y:auto;border:1px solid var(--border);border-radius:4px;padding:8px;margin-top:4px;}
  .subject-checks label{display:flex;align-items:center;gap:8px;font-weight:500;margin:0;color:var(--ink);font-size:14px;}
  .subject-checks input{width:auto;}
  @media print{
    .report-card-print{page-break-after:always;}
  }

  .report-card{background:#fff;border:1px solid var(--border);border-radius:6px;padding:24px;max-width:560px;margin-top:16px;}
  .report-card h3{color:var(--chalk-green);margin:0 0 2px;}
  .report-card .meta{font-size:13px;color:var(--ink-soft);margin-bottom:14px;}
  .report-card table{margin-top:10px;}
  .report-card .comments{margin-top:16px;font-size:13.5px;line-height:1.6;}
  .report-card .comments b{color:var(--chalk-green);}

  @media(max-width:820px){
    .shell{flex-direction:column;}
    .sidebar{width:100%;height:auto;position:relative;display:flex;flex-wrap:wrap;gap:4px;padding:14px;}
    .sidebar .brand,.sidebar .brand-sub{width:100%;}
    .navbtn{width:auto;flex:1 1 auto;text-align:center;font-size:13px;padding:9px 8px;}
    .sidebar .signout{width:auto;margin-left:auto;}
    .main{padding:18px;}
  }
  @media print{
    .sidebar,.topline .btn,#printBtnWrap{display:none !important;}
    .main{padding:0;max-width:none;}
    body{background:#fff;}
  }
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="loginScreen">
  <div class="login-card">
    <h1>🏫 <span id="brandName">School Admin</span></h1>
    <p class="sub" id="brandMotto">Baby Class – P7 · Marks & Reports</p>

    <div class="tabs-auth">
      <button id="tabSignin" class="active" onclick="setAuthMode('signin')">Sign in</button>
      <button id="tabSignup" onclick="setAuthMode('signup')">Teacher sign up</button>
    </div>

    <div id="signupNameWrap" style="display:none;">
      <label>Full name</label>
      <input id="signupName" placeholder="e.g. Nakato Grace">
    </div>
    <label>Email</label>
    <input id="authEmail" type="email" placeholder="you@example.com">
    <label>Password</label>
    <input id="authPass" type="password" placeholder="••••••••">

    <button class="primary" id="authSubmitBtn" onclick="handleAuthSubmit()">Sign in</button>
    <div class="login-error" id="authError"></div>
    <div style="text-align:center;margin-top:10px;"><a href="#" onclick="handleForgotPassword();return false;" style="font-size:12.5px;color:var(--rule-blue);">Forgot password?</a></div>
    <div class="login-note" id="authNote">Admins: sign in with the account created in Supabase. Teachers: use "Teacher sign up" to create your own login — the admin will then assign your class and subject.</div>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app">
  <div class="shell">
    <div class="sidebar">
      <div class="brand">🏫 School Admin</div>
      <div class="brand-sub">Baby Class – P7</div>
      <button class="navbtn" data-tab="dashboard" onclick="showTab('dashboard')">Dashboard</button>
      <button class="navbtn" data-tab="classes" onclick="showTab('classes')">Classes & Streams</button>
      <button class="navbtn" data-tab="promote" onclick="showTab('promote')">Promote Students</button>
      <button class="navbtn" data-tab="subjects" onclick="showTab('subjects')">Subjects</button>
      <button class="navbtn" data-tab="terms" onclick="showTab('terms')">Terms</button>
      <button class="navbtn" data-tab="students" onclick="showTab('students')">Students</button>
      <button class="navbtn" data-tab="teachers" onclick="showTab('teachers')">Teachers</button>
      <button class="navbtn" data-tab="attendance" onclick="showTab('attendance')">Attendance</button>
      <button class="navbtn" data-tab="reports" onclick="showTab('reports')">Reports</button>
      <button class="navbtn" data-tab="admins" onclick="showTab('admins')">Admins</button>
      <button class="navbtn" data-tab="settings" onclick="showTab('settings')">School Settings</button>
      <button class="signout" onclick="signOut()">Sign out</button>
    </div>
    <div class="main" id="mainContent"></div>
  </div>
</div>

<!-- Generic modal -->
<div class="modal-bg" id="modalBg">
  <div class="modal" id="modalBox"></div>
</div>

<script>
/* ============================================================
   CONFIG
   ============================================================ */
const SUPABASE_URL = "https://efqstsysxpdkkxiarumf.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVmcXN0c3lzeHBka2t4aWFydW1mIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc4MjMyNzcsImV4cCI6MjEwMzM5OTI3N30.J0DrMc3zdbBXkOyoTw3je-GSPnW-ClEYZM16l27Y47k";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* Uganda PLE-style grading: 1 (best) to 9 (fail) per subject */
const GRADE_BANDS = [
  {min:85,max:100,grade:'D1',point:1,comment:'Excellent'},
  {min:70,max:84,grade:'D2',point:2,comment:'Very Good'},
  {min:60,max:69,grade:'C3',point:3,comment:'Good'},
  {min:50,max:59,grade:'C4',point:4,comment:'Fairly Good'},
  {min:45,max:49,grade:'C5',point:5,comment:'Adequate'},
  {min:40,max:44,grade:'C6',point:6,comment:'Basic'},
  {min:35,max:39,grade:'P7',point:7,comment:'Pass'},
  {min:30,max:34,grade:'P8',point:8,comment:'Pass'},
  {min:0,max:29,grade:'F9',point:9,comment:'Fail'},
];
function gradeFor(score){
  if(score===null||score===undefined||score==='') return {grade:'-',point:null,comment:''};
  const s = parseFloat(score);
  for(const b of GRADE_BANDS){ if(s>=b.min && s<=b.max) return b; }
  return {grade:'-',point:null,comment:''};
}
const CORE_SUBJECTS = ['english','mathematics','integrated science','social studies'];
function divisionFor(aggregate){
  if(aggregate>=4 && aggregate<=12) return 'Division One';
  if(aggregate>=13 && aggregate<=23) return 'Division Two';
  if(aggregate>=24 && aggregate<=29) return 'Division Three';
  if(aggregate>=30 && aggregate<=34) return 'Division Four';
  if(aggregate>=35) return 'Ungraded';
  return '—';
}

let CURRENT_USER = null;
let CURRENT_PROFILE = null;
let CACHE = { classes:[], streams:[], subjects:[], terms:[], students:[], teachers:[], assignments:[] };
let SCHOOL_SETTINGS = {};

async function handleForgotPassword(){
  const email = document.getElementById('authEmail').value.trim();
  if(!email){ alert('Type your email in the Email field first, then click "Forgot password?"'); return; }
  const redirectTo = location.href.replace(/admin\.html.*$/, 'reset-password.html');
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo });
  if(error){ alert(error.message); return; }
  alert('If that email has an account, a password reset link has been sent. Check your inbox.');
}

async function loadBranding(){
  const { data } = await sb.from('school_settings').select('*').eq('id',1).maybeSingle();
  if(data){
    if(data.school_name){
      document.getElementById('brandName').textContent = data.school_name;
      document.title = data.school_name + ' — Admin';
    }
    if(data.motto) document.getElementById('brandMotto').textContent = data.motto;
  }
}
loadBranding();

/* ============================================================
   AUTH
   ============================================================ */
let authMode = 'signin';
function setAuthMode(mode){
  authMode = mode;
  document.getElementById('tabSignin').classList.toggle('active', mode==='signin');
  document.getElementById('tabSignup').classList.toggle('active', mode==='signup');
  document.getElementById('signupNameWrap').style.display = mode==='signup' ? 'block' : 'none';
  document.getElementById('authSubmitBtn').textContent = mode==='signup' ? 'Create teacher account' : 'Sign in';
  document.getElementById('authNote').textContent = mode==='signup'
    ? 'This creates your login. After signing up, ask the admin to assign you a class and subject before you can enter marks.'
    : 'Admins: sign in with the account created in Supabase. Teachers: use "Teacher sign up" to create your own login — the admin will then assign your class and subject.';
  document.getElementById('authError').textContent = '';
}

async function handleAuthSubmit(){
  const email = document.getElementById('authEmail').value.trim();
  const pass = document.getElementById('authPass').value;
  const errEl = document.getElementById('authError');
  errEl.textContent = '';
  if(!email || !pass){ errEl.textContent = 'Enter email and password.'; return; }

  const btn = document.getElementById('authSubmitBtn');
  btn.disabled = true;

  try{
    if(authMode === 'signup'){
      const name = document.getElementById('signupName').value.trim();
      if(!name){ errEl.textContent = 'Enter your full name.'; btn.disabled=false; return; }
      const { data, error } = await sb.auth.signUp({ email, password: pass });
      if(error) throw error;
      if(data.user){
        const { error: profErr } = await sb.from('profiles').insert({
          id: data.user.id, full_name: name, role: 'teacher'
        });
        if(profErr) throw profErr;
      }
      errEl.style.color = 'var(--good)';
      errEl.textContent = 'Account created. If email confirmation is on, check your inbox, then sign in.';
      setAuthMode('signin');
      btn.disabled=false;
      return;
    } else {
      const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
      if(error) throw error;
      await afterLogin();
    }
  }catch(e){
    errEl.style.color = 'var(--pen-red)';
    errEl.textContent = e.message || 'Something went wrong.';
    btn.disabled = false;
  }
}

async function afterLogin(){
  const { data:{ user } } = await sb.auth.getUser();
  CURRENT_USER = user;
  const { data: profile, error } = await sb.from('profiles').select('*').eq('id', user.id).single();
  if(error || !profile){
    document.getElementById('authError').textContent = 'No profile found for this login. Ask the admin to check your account.';
    return;
  }
  CURRENT_PROFILE = profile;
  if(profile.role !== 'admin'){
    document.getElementById('loginScreen').style.display='flex';
    document.getElementById('app').style.display='none';
    document.getElementById('authError').style.color='var(--ink-soft)';
    document.getElementById('authError').textContent = 'This is the admin dashboard. Teacher marks-entry page is coming next — ask your admin.';
    return;
  }
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('app').style.display='block';
  await loadAllData();
  showTab('dashboard');
}

async function signOut(){
  await sb.auth.signOut();
  location.reload();
}

/* Check session on load */
(async function init(){
  const { data:{ session } } = await sb.auth.getSession();
  if(session){ await afterLogin(); }
})();

/* ============================================================
   DATA LOADING
   ============================================================ */
async function loadAllData(){
  const [c,s,sub,t,st,tc,as,settings] = await Promise.all([
    sb.from('classes').select('*').order('sort_order'),
    sb.from('streams').select('*'),
    sb.from('subjects').select('*').order('name'),
    sb.from('terms').select('*').order('year',{ascending:false}),
    sb.from('students').select('*').order('full_name'),
    sb.from('profiles').select('*').eq('role','teacher').order('full_name'),
    sb.from('teacher_assignments').select('*'),
    sb.from('school_settings').select('*').eq('id',1).maybeSingle(),
  ]);
  CACHE.classes = c.data||[];
  CACHE.streams = s.data||[];
  CACHE.subjects = sub.data||[];
  CACHE.terms = t.data||[];
  CACHE.students = st.data||[];
  CACHE.teachers = tc.data||[];
  CACHE.assignments = as.data||[];
  SCHOOL_SETTINGS = settings.data || {};
}
function className(id){ return CACHE.classes.find(c=>c.id===id)?.name || '—'; }
function streamName(id){ return CACHE.streams.find(s=>s.id===id)?.name || ''; }
function subjectName(id){ return CACHE.subjects.find(s=>s.id===id)?.name || '—'; }
function termName(id){ const t=CACHE.terms.find(t=>t.id===id); return t? `${t.name} ${t.year}`:'—'; }
function teacherName(id){ return CACHE.teachers.find(t=>t.id===id)?.full_name || '—'; }

/* ============================================================
   TAB ROUTING
   ============================================================ */
const RENDERERS = {
  dashboard: renderDashboard,
  classes: renderClasses,
  promote: renderPromote,
  subjects: renderSubjects,
  terms: renderTerms,
  students: renderStudents,
  teachers: renderTeachers,
  attendance: renderAttendance,
  reports: renderReports,
  admins: renderAdmins,
  settings: renderSettings,
};
async function showTab(tab){
  document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
  const main = document.getElementById('mainContent');
  main.innerHTML = '<div class="loading">Loading…</div>';
  await loadAllData();
  RENDERERS[tab]();
}

/* ============================================================
   DASHBOARD
   ============================================================ */
function renderDashboard(){
  const main = document.getElementById('mainContent');
  const currentTerm = CACHE.terms.find(t=>t.is_current);
  main.innerHTML = `
    <div class="topline"><div><h2>Dashboard</h2><p>Overview of your school</p></div></div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;">
      ${statCard('Classes', CACHE.classes.length)}
      ${statCard('Students', CACHE.students.filter(s=>s.status==='active').length)}
      ${statCard('Teachers', CACHE.teachers.length)}
      ${statCard('Subjects', CACHE.subjects.length)}
    </div>
    <div style="margin-top:24px;" class="card">
      <table><thead><tr><th>Current term</th></tr></thead>
      <tbody><tr><td>${currentTerm ? currentTerm.name+' '+currentTerm.year : 'No term marked as current — set one in the Terms tab'}</td></tr></tbody></table>
    </div>
    <div class="section-title" style="margin-top:24px;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);font-weight:700;">Students per class</div>
    <div class="card">
      <table>
        <thead><tr><th>Class</th><th class="num">Active students</th></tr></thead>
        <tbody>
        ${CACHE.classes.map(c=>{
          const count = CACHE.students.filter(s=>s.class_id===c.id && s.status==='active').length;
          return `<tr><td>${c.name}</td><td class="num">${count}</td></tr>`;
        }).join('') || '<tr><td colspan="2" class="empty">No classes yet</td></tr>'}
        </tbody>
      </table>
    </div>
  `;
}
function statCard(label,val){

function previewPhoto(input){
  if(!input.files || !input.files[0]) return;
  const reader = new FileReader();
  reader.onload = e => {

    img.src = e.target.result;
    img.style.display = 'block';
  };
  reader.readAsDataURL(input.files[0]);
}

  const sel = document.getElementById('f_stream');
  const streams = CACHE.streams.filter(s=>s.class_id===classId);

}
function exportStudentsCSV(){
  const header = ['Full Name','Admission No','Gender','DOB','Class','Stream','Guardian Name','Guardian Contact','Status'];
  const rows = [header];
  CACHE.students.forEach(s=>{
    rows.push([s.full_name, s.admission_no||'', s.gender||'', s.dob||'', className(s.class_id), streamName(s.stream_id), s.guardian_name||'', s.guardian_contact||'', s.status]);
  });
  downloadCSV('students.csv', rows);
}
async function saveStudent(id){
  const full_name = document.getElementById('f_name').value.trim();
  if(!full_name){ document.getElementById('f_err').textContent='Name is required.'; return; }
  const errEl = document.getElementById('f_err');

  let photo_url = document.getElementById('f_photo_url').value || null;
  const fileInput = document.getElementById('f_photo');
  if(fileInput.files && fileInput.files[0]){
    errEl.style.color = 'var(--ink-soft)';
    errEl.textContent = 'Uploading photo…';
    const file = fileInput.files[0];
    const path = `${Date.now()}_${file.name.replace(/[^a-zA-Z0-9._-]/g,'')}`;
    const { error: upErr } = await sb.storage.from('student-photos').upload(path, file, { upsert:true });
    if(upErr){ errEl.style.color='var(--pen-red)'; errEl.textContent = 'Photo upload failed: ' + upErr.message; return; }
    const { data: pub } = sb.storage.from('student-photos').getPublicUrl(path);
    photo_url = pub.publicUrl;
    errEl.textContent = '';
  }

  const payload = {
    full_name,
    photo_url,
    admission_no: document.getElementById('f_adm').value.trim() || null,
    gender: document.getElementById('f_gender').value || null,
    dob: document.getElementById('f_dob').value || null,
    class_id: document.getElementById('f_class').value || null,
    stream_id: document.getElementById('f_stream').value || null,
    guardian_name: document.getElementById('f_guardian').value.trim() || null,
    guardian_contact: document.getElementById('f_contact').value.trim() || null,
    status: document.getElementById('f_status').value,
  };
  const { error } = id ? await sb.from('students').update(payload).eq('id',id) : await sb.from('students').insert(payload);
  if(error){ errEl.style.color='var(--pen-red)'; errEl.textContent = error.message; return; }
  closeModal(); showTab('students');
}

let promoteFromClass='';
function nextClassFor(classId){
  const sorted = [...CACHE.classes].sort((a,b)=>a.sort_order-b.sort_order);
  const idx = sorted.findIndex(c=>c.id===classId);
  if(idx===-1) return null;
  return sorted[idx+1] || null; // null = final class (e.g. P7)
}

  area.innerHTML = `
    <div class="banner">
      ${next
        ? `These students will move from <b>${className(promoteFromClass)}</b> to <b>${next.name}</b>. Untick anyone repeating the class.`
        : `<b>${className(promoteFromClass)}</b> is the final class — these students will be marked as completed/promoted and removed from the active roll (their records stay in the system). Untick anyone repeating.`
      }
    </div>
    <div class="card">
      <table>
        <thead><tr><th style="width:36px;"><input type="checkbox" checked onchange="toggleAllPromote(this)"></th><th>Student</th><th>Current stream</th></tr></thead>
        <tbody>
        ${students.map(st=>`<tr>
          <td><input type="checkbox" class="promote-cb" value="${st.id}" checked></td>
          <td>${st.full_name}</td>
          <td>${streamName(st.stream_id)||'—'}</td>
        </tr>`).join('')}
        </tbody>
      </table>
    </div>
    <div style="margin-top:14px;">
      <button class="btn btn-add" onclick="runPromotion()">Promote ${students.length} checked students</button>
    </div>
  `;
}
function toggleAllPromote(master){
  document.querySelectorAll('.promote-cb').forEach(cb=>cb.checked = master.checked);
}
async function runPromotion(){
  const checked = Array.from(document.querySelectorAll('.promote-cb:checked')).map(cb=>cb.value);
  if(checked.length===0){ alert('No students selected.'); return; }
  const next = nextClassFor(promoteFromClass);
  if(!confirm(`Promote ${checked.length} student(s)${next? ' to '+next.name : ' as completed/graduated'}? This cannot be undone automatically.`)) return;

  let error;
  if(next){
    // try to match a stream of the same name in the destination class; else leave blank
    for(const studentId of checked){
      const st = CACHE.students.find(s=>s.id===studentId);
      const curStreamName = streamName(st.stream_id);
      const matchStream = curStreamName ? CACHE.streams.find(s=>s.class_id===next.id && s.name===curStreamName) : null;
      const { error: e } = await sb.from('students').update({
        class_id: next.id,
        stream_id: matchStream ? matchStream.id : null,
      }).eq('id', studentId);
      if(e) error = e;
    }
  } else {
    const { error: e } = await sb.from('students').update({ status: 'promoted' }).in('id', checked);
    error = e;
  }
  if(error){ alert(error.message); return; }
  alert('Done.');
  showTab('promote');
}

let attClass='', attDate='';
function renderAttendance(){
  const main = document.getElementById('mainContent');
  if(!attDate) attDate = new Date().toISOString().slice(0,10);
  main.innerHTML = `
    <div class="topline"><div><h2>Attendance</h2><p>Roll call records kept by teachers, viewable by date and class</p></div></div>
    <div class="filters">
      <select id="attClassSelect" onchange="attClass=this.value; loadAttendance();">
        <option value="">Choose class…</option>
        ${CACHE.classes.map(c=>`<option value="${c.id}" ${attClass===c.id?'selected':''}>${c.name}</option>`).join('')}
      </select>
      <input type="date" id="attDateInput" value="${attDate}" onchange="attDate=this.value; loadAttendance();" style="width:auto;">
    </div>
    <div id="attArea"></div>
  `;
  if(attClass) loadAttendance();
}
async function loadAttendance(){
  const area = document.getElementById('attArea');
  area.innerHTML = '<div class="loading">Loading…</div>';
  const studentsInClass = CACHE.students.filter(s=>s.class_id===attClass && s.status==='active');
  const { data: records } = await sb.from('attendance').select('*').eq('date', attDate).in('student_id', studentsInClass.length ? studentsInClass.map(s=>s.id) : ['00000000-0000-0000-0000-000000000000']);

  const present = (records||[]).filter(r=>r.status==='present').length;
  const absent = (records||[]).filter(r=>r.status==='absent').length;
  const notMarked = studentsInClass.length - present - absent;

  area.innerHTML = `
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;margin-bottom:18px;">
      ${statCard('Total students', studentsInClass.length)}
      ${statCard('Present', present)}
      ${statCard('Absent', absent)}
      ${statCard('Not marked', notMarked)}
    </div>
    <div class="card">
      <table>
        <thead><tr><th>Student</th><th>Status</th><th>Marked by</th></tr></thead>
        <tbody>
        ${studentsInClass.map(st=>{
          const rec = (records||[]).find(r=>r.student_id===st.id);
          const pill = rec ? `<span class="pill ${rec.status==='present'?'active':'left'}">${rec.status}</span>` : '<span style="color:var(--ink-soft);">not marked</span>';
          return `<tr><td>${st.full_name}</td><td>${pill}</td><td>${rec?teacherName(rec.marked_by):'—'}</td></tr>`;
        }).join('') || '<tr><td colspan="3" class="empty">No active students in this class</td></tr>'}
        </tbody>
      </table>
    </div>
  `;
}

let reportClass='', reportTerm='', reportStudentId='';
function renderReports(){
  const main = document.getElementById('mainContent');
  const currentTerm = CACHE.terms.find(t=>t.is_current);
  if(!reportTerm && currentTerm) reportTerm = currentTerm.id;
  main.innerHTML = `
    <div class="topline"><div><h2>Reports</h2><p>Pick a class and term to see marks, or open one student's report card</p></div></div>
    <div class="filters">
      <select id="rClass" onchange="reportClass=this.value; renderReports();">
        <option value="">Choose class…</option>
        ${CACHE.classes.map(c=>`<option value="${c.id}" ${reportClass===c.id?'selected':''}>${c.name}</option>`).join('')}
      </select>
      <select id="rTerm" onchange="reportTerm=this.value; renderReports();">
        <option value="">Choose term…</option>
        ${CACHE.terms.map(t=>`<option value="${t.id}" ${reportTerm===t.id?'selected':''}>${t.name} ${t.year}</option>`).join('')}
      </select>
    </div>
    <div id="reportArea"></div>
  `;
  if(reportClass && reportTerm) loadClassMarks();
}
async function loadClassMarks(){
  const area = document.getElementById('reportArea');
  area.innerHTML = '<div class="loading">Loading marks…</div>';
  const studentsInClass = CACHE.students.filter(s=>s.class_id===reportClass && s.status==='active');
  const { data: marks } = await sb.from('marks').select('*').eq('term_id', reportTerm);
  const subjectsUsed = CACHE.subjects;

  area.innerHTML = `
    <div style="display:flex;justify-content:flex-end;margin-bottom:10px;gap:10px;">
      <button class="btn btn-ghost" onclick="exportClassMarksCSV()">⬇️ Export CSV</button>
      <button class="btn btn-ghost" onclick="printAllReports()">🖨️ Print all report cards for this class</button>
    </div>
    <p style="font-size:12.5px;color:var(--ink-soft);margin:-4px 0 10px;">As admin you can edit any score directly below — click a box, type, then click elsewhere to save.</p>
    <div class="card">
      <table>
        <thead><tr><th>Student</th>${subjectsUsed.map(s=>`<th class="num">${s.code||s.name}</th>`).join('')}<th class="num">Avg</th><th></th></tr></thead>
        <tbody>
        ${studentsInClass.map(st=>{
          const rowMarks = subjectsUsed.map(sub=>{
            const m = (marks||[]).find(mk=>mk.student_id===st.id && mk.subject_id===sub.id);
            return m ? m.score : null;
          });
          const valid = rowMarks.filter(v=>v!==null);
          const avg = valid.length ? (valid.reduce((a,b)=>a+parseFloat(b),0)/valid.length).toFixed(1) : '—';
          return `<tr>
            <td><b>${st.full_name}</b></td>
            ${subjectsUsed.map((sub,i)=>`<td><input type="number" min="0" max="100" class="score-input" style="width:56px;padding:5px;text-align:center;" value="${rowMarks[i]!==null?rowMarks[i]:''}" onchange="adminSaveMark('${st.id}','${sub.id}',this.value)"></td>`).join('')}
            <td class="num"><b>${avg}</b></td>
            <td><button class="btn-small" onclick="openReportCard('${st.id}')">Report card</button></td>
          </tr>`;
        }).join('') || `<tr><td colspan="${subjectsUsed.length+3}" class="empty">No active students in this class</td></tr>`}
        </tbody>
      </table>
    </div>
    <div id="reportCardArea"></div>
  `;
}
async function adminSaveMark(studentId, subjectId, value){
  const val = value.trim();
  if(val===''){ return; }
  const score = parseFloat(val);
  if(isNaN(score)||score<0||score>100){ alert('Score must be between 0 and 100.'); return; }
  const { error } = await sb.from('marks').upsert({
    student_id: studentId, subject_id: subjectId, term_id: reportTerm, score, entered_by: CURRENT_USER.id
  }, { onConflict:'student_id,subject_id,term_id' });
  if(error){ alert('Could not save: ' + error.message); }
}
function downloadCSV(filename, rows){
  const csv = rows.map(r => r.map(cell => `"${String(cell??'').replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
}
async function exportClassMarksCSV(){
  const studentsInClass = CACHE.students.filter(s=>s.class_id===reportClass && s.status==='active');
  const { data: marks } = await sb.from('marks').select('*').eq('term_id', reportTerm);
  const term = CACHE.terms.find(t=>t.id===reportTerm);
  const header = ['Student', ...CACHE.subjects.map(s=>s.name), 'Average'];
  const rows = [header];
  studentsInClass.forEach(st=>{
    const scores = CACHE.subjects.map(sub=>{
      const m = (marks||[]).find(mk=>mk.student_id===st.id && mk.subject_id===sub.id);
      return m ? m.score : '';
    });
    const valid = scores.filter(v=>v!=='');
    const avg = valid.length ? (valid.reduce((a,b)=>a+parseFloat(b),0)/valid.length).toFixed(1) : '';
    rows.push([st.full_name, ...scores, avg]);
  });
  downloadCSV(`${className(reportClass)}_${term?term.name+'_'+term.year:'marks'}.csv`, rows);
}
function buildReportCardHTML(student, marks, commentRow, term){
  const rows = (marks||[]).map(m=>{
    const g = gradeFor(parseFloat(m.score));
    return `<tr><td>${subjectName(m.subject_id)}</td><td class="num">${m.score}</td><td class="num grade-${g.grade}">${g.grade}</td><td>${g.comment}</td></tr>`;
  }).join('') || `<tr><td colspan="4" class="empty">No marks entered yet for this term</td></tr>`;

  const coreMarks = (marks||[]).filter(m => {
    const n = (subjectName(m.subject_id)||'').toLowerCase();
    return CORE_SUBJECTS.some(keyword => n.includes(keyword));
  });
  let aggregateBlock = '';
  if(coreMarks.length === CORE_SUBJECTS.length){
    const aggregate = coreMarks.reduce((sum,m)=> sum + (gradeFor(parseFloat(m.score)).point||0), 0);
    aggregateBlock = `<div style="margin-top:10px;font-size:14px;"><b>Aggregate: ${aggregate}</b> — <b>${divisionFor(aggregate)}</b></div>`;
  }

  const validScores = (marks||[]).map(m=>parseFloat(m.score));
  const avg = validScores.length ? (validScores.reduce((a,b)=>a+b,0)/validScores.length).toFixed(1) : '—';

  return `
    <div class="report-card report-card-print">
      ${SCHOOL_SETTINGS.logo_url?`<img src="${SCHOOL_SETTINGS.logo_url}" style="max-height:50px;display:block;margin-bottom:8px;">`:''}
      ${SCHOOL_SETTINGS.school_name?`<div style="font-family:'Zilla Slab',Georgia,serif;font-size:20px;color:var(--chalk-green);font-weight:700;">${SCHOOL_SETTINGS.school_name}</div>`:''}
      ${SCHOOL_SETTINGS.motto?`<div style="font-size:12px;color:var(--ink-soft);font-style:italic;margin-bottom:10px;">${SCHOOL_SETTINGS.motto}</div>`:''}
      ${student.photo_url?`<img src="${student.photo_url}" class="student-photo-lg">`:''}
      <h3>${student.full_name}</h3>
      <div class="meta">${className(student.class_id)}${student.stream_id?' '+streamName(student.stream_id):''} · ${term?term.name+' '+term.year:''}${student.admission_no?' · Adm# '+student.admission_no:''}</div>
      <table>
        <thead><tr><th>Subject</th><th class="num">Score</th><th class="num">Grade</th><th>Remark</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
      <div style="margin-top:10px;font-size:14px;">Average: ${avg}%</div>
      ${aggregateBlock}
      <div class="comments">
        <div><b>Class teacher's comment:</b> ${commentRow?.class_teacher_comment || '<span style="color:var(--ink-soft);">Not yet added</span>'}</div>
        <div style="margin-top:6px;"><b>Head teacher's comment:</b> ${commentRow?.head_teacher_comment || '<span style="color:var(--ink-soft);">Not yet added</span>'}</div>
      </div>
    </div>
  `;
}

async function openReportCard(studentId){
  const student = CACHE.students.find(s=>s.id===studentId);
  const { data: marks } = await sb.from('marks').select('*').eq('student_id',studentId).eq('term_id',reportTerm);
  const { data: commentRow } = await sb.from('report_comments').select('*').eq('student_id',studentId).eq('term_id',reportTerm).maybeSingle();
  const term = CACHE.terms.find(t=>t.id===reportTerm);

  document.getElementById('reportCardArea').innerHTML = `
    <div id="printableReport">${buildReportCardHTML(student, marks, commentRow, term)}</div>
    <div id="printBtnWrap" style="margin-top:14px;display:flex;gap:10px;">
      <button class="btn btn-ghost" onclick="window.print()">Print report card</button>
      <button class="btn btn-ghost" onclick="openCommentsModal('${studentId}')">Edit comments</button>
    </div>
  `;
}

async function printAllReports(){
  const studentsInClass = CACHE.students.filter(s=>s.class_id===reportClass && s.status==='active');
  if(studentsInClass.length===0){ alert('No active students in this class.'); return; }
  const term = CACHE.terms.find(t=>t.id===reportTerm);

  const [{data: allMarks}, {data: allComments}] = await Promise.all([
    sb.from('marks').select('*').eq('term_id', reportTerm),
    sb.from('report_comments').select('*').eq('term_id', reportTerm),
  ]);

  const html = studentsInClass.map(st=>{
    const marks = (allMarks||[]).filter(m=>m.student_id===st.id);
    const commentRow = (allComments||[]).find(c=>c.student_id===st.id);
    return buildReportCardHTML(st, marks, commentRow, term);
  }).join('');

  document.getElementById('reportCardArea').innerHTML = `<div id="printableReport">${html}</div>
    <div id="printBtnWrap" style="margin-top:14px;"><button class="btn btn-ghost" onclick="window.print()">Print all ${studentsInClass.length} report cards</button></div>`;
  window.print();
}
function openCommentsModal(studentId){
  sb.from('report_comments').select('*').eq('student_id',studentId).eq('term_id',reportTerm).maybeSingle().then(({data:row})=>{
    openModal(`
      <h3>Report Comments</h3>
      <label>Class teacher's comment</label>
      <textarea id="f_ct" rows="3">${row?.class_teacher_comment||''}</textarea>
      <label>Head teacher's comment</label>
      <textarea id="f_ht" rows="3">${row?.head_teacher_comment||''}</textarea>
      <div class="field-error" id="f_err"></div>
      <div class="modal-actions">
        <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
        <button class="btn btn-add" onclick="saveComments('${studentId}')">Save</button>
      </div>
    `);
  });
}
async function saveComments(studentId){
  const class_teacher_comment = document.getElementById('f_ct').value.trim();
  const head_teacher_comment = document.getElementById('f_ht').value.trim();
  const { data: existing } = await sb.from('report_comments').select('id').eq('student_id',studentId).eq('term_id',reportTerm).maybeSingle();
  let error;
  if(existing){
    ({error} = await sb.from('report_comments').update({class_teacher_comment, head_teacher_comment}).eq('id',existing.id));
  } else {
    ({error} = await sb.from('report_comments').insert({student_id:studentId, term_id:reportTerm, class_teacher_comment, head_teacher_comment}));
  }
  if(error){ document.getElementById('f_err').textContent = error.message; return; }
  closeModal(); openReportCard(studentId);
}

   ============================================================ */
function openModal(html){
  document.getElementById('modalBox').innerHTML = html;
  document.getElementById('modalBg').classList.add('show');
}
function closeModal(){ document.getElementById('modalBg').classList.remove('show'); }
document.getElementById('modalBg').addEventListener('click', e=>{ if(e.target.id==='modalBg') closeModal(); });

async function deleteRow(table, id, label){
  if(!confirm(`Delete this ${label}? This cannot be undone.`)) return;
  const { error } = await sb.from(table).delete().eq('id', id);
  if(error){ alert(error.message); return; }
  const tabMap = { classes:'classes', subjects:'subjects', terms:'terms', students:'students', teacher_assignments:'teachers' };
  showTab(tabMap[table] || 'dashboard');
}
